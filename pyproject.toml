[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "angel-cli"
version = "0.1.0"
description = "Un framework de orquestación de agentes de IA basado en Markdown y YAML."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "python-frontmatter>=1.1.0"
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]

[project.scripts]
angel = "angel.main:app"

[tool.hatch.build.targets.wheel]
packages = ["angel"]
